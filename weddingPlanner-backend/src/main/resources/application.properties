spring.application.name=weddingPlanner
server.port=${PORT:8080}

# Database Configuration (supports PostgreSQL via Docker env or defaults to H2 for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wedplandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (active when using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
