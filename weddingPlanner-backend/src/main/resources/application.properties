spring.application.name=weddingPlanner
server.port=${PORT:8080}

# Database Configuration (supports PostgreSQL via Docker env or defaults to H2 for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:wedplandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Auto DDL
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# H2 Web Console (active when using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MongoDB NoSQL Configuration (for Audit & Activity Logs)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/wedplan_logs}
spring.data.mongodb.auto-index-creation=true

# Redis NoSQL Configuration (for Caching & Rate Limiting)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# OAuth2 Social Login Configuration (Google / GitHub)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-dev}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-dev}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id-dev}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret-dev}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
